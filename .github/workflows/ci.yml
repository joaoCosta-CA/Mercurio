name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev,server,google,whatsapp-client]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src/mercurio src/mercurio_server
      - run: pytest
      - run: pip wheel --no-deps . -w dist
