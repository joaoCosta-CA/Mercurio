[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "mercurio-academico"
version = "0.1.0"
description = "Lembretes locais de atividades do Google Classroom"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Projeto Mercurio" }]
dependencies = []

[project.optional-dependencies]
google = [
  "google-api-python-client>=2.150",
  "google-auth-oauthlib>=1.2",
  "google-auth-httplib2>=0.2",
  "keyring>=25",
]
whatsapp-client = ["httpx>=0.27"]
server = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "cryptography>=43",
]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5",
  "ruff>=0.7",
  "mypy>=1.13",
]

[project.scripts]
mercurio = "mercurio.cli:main"
mercurio-whatsapp-server = "mercurio_server.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/mercurio", "src/mercurio_server"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=mercurio --cov-fail-under=85"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mercurio"]
